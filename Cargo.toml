[package]
name = "lane"
version = "0.0.0"
edition = "2021"
description = "Linear-first local agent-work orchestration — read-only board (Slice 1 skeleton)"
license = "MIT"
publish = false

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "lane"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
