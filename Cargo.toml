[package]
name = "lane"
version = "0.0.0"
edition = "2021"
description = "Portable, offline-capable local agent-work orchestration — local lane claims, leases, target-overlap, and audit"
license = "MIT"
publish = false

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "lane"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
# Slice 2: NFC normalization of target path segments for the overlap invariant.
# std has no Unicode NFC; this is the single new dependency (Commander-approved).
# Network-free, no async, no transitive HTTP/DB heft.
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
